services:

  proxy:
    image: nginx:alpine
    ports:
      - "${APP_PORT}:80"      # host port (from .env) → container port 80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro   # bind mount, read-only
    depends_on:
      - web                   # start web before proxy

  web:    
    build: .             
    env_file:
      - .env                  # load all variables from .env file
    depends_on:
      redis:
        condition: service_healthy

    

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data  
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      

volumes:
  redis_data:                 # declare the named volume